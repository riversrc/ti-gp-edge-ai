# CI: checks that the backend compiles and every demo YAML is valid.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate demo YAMLs
        run: |
          python - <<'EOF'
          import glob
          import yaml

          for path in glob.glob("demos/*.yaml"):
              with open(path) as f:
                  yaml.safe_load(f)
              print(f"OK: {path}")
          EOF
